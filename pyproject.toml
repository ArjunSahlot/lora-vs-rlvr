[project]
name = "lora-vs-rlvr"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=1.7.2",
    "torch>=2.10",
    "unsloth>=2026.3.8",
    "datasets<=4.3.0",
    "math-verify>=0.9.0",
    "torchvision>=0.25.0",
    "torchaudio>=2.10.0",
    "transformers>=5.5.0",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }
